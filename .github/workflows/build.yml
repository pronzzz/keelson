name: Build

# Builds and packages Keelson on every push and pull request.
# (The self-test needs to boot VMs, which GitHub's macOS runners can't do, so it runs locally.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Check the installer catalog resolves
        run: build/Keelson.app/Contents/MacOS/Keelson --catalog || echo "::warning::Installer catalog unreachable from the runner"
      - name: Package
        run: cd build && ditto -c -k --keepParent Keelson.app Keelson.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Keelson
          path: build/Keelson.zip
